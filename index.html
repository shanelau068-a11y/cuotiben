<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏆 湘桥区2026年诗词大赛错题本</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background: linear-gradient(180deg,#FFF8E7 0%,#FFEFc9 100%);
    min-height:100vh; color:#4a3b2a; padding-bottom:40px;
  }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px; }
  .hide { display:none !important; }

  /* 首页 */
  .hero { text-align:center; padding:28px 0 10px; }
  .hero .emoji { font-size:56px; }
  .hero h1 { font-size:30px; margin:8px 0 4px; color:#b3541e; }
  .hero p { font-size:15px; color:#8a6d4b; }
  .stat-card {
    background:#fff; border-radius:18px; padding:18px; margin:18px 0;
    box-shadow:0 4px 14px rgba(180,120,40,.12); display:flex; text-align:center;
  }
  .stat-card div { flex:1; }
  .stat-card .num { font-size:30px; font-weight:800; color:#e07b2a; }
  .stat-card .lbl { font-size:13px; color:#8a6d4b; margin-top:4px; }
  .big-btn {
    display:block; width:100%; border:none; border-radius:18px;
    padding:18px; font-size:20px; font-weight:700; margin:12px 0; cursor:pointer;
    transition:transform .08s;
  }
  .big-btn:active { transform:scale(.97); }
  .btn-go { background:linear-gradient(135deg,#ffb347,#ff8c42); color:#fff; box-shadow:0 6px 16px rgba(255,140,66,.35); }
  .btn-review { background:#fff; color:#b3541e; border:2px solid #f0d9b5; }

  /* 答题页 */
  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .back { font-size:15px; color:#8a6d4b; background:none; border:none; cursor:pointer; }
  .progress { font-size:14px; color:#8a6d4b; }
  .pbar { height:8px; background:#f0e2c8; border-radius:99px; overflow:hidden; margin-bottom:16px; }
  .pbar i { display:block; height:100%; background:linear-gradient(90deg,#ffb347,#ff8c42); border-radius:99px; transition:width .3s; }
  .qcard { background:#fff; border-radius:18px; padding:20px; box-shadow:0 4px 14px rgba(180,120,40,.12); }
  .qtype { display:inline-block; font-size:12px; background:#fef3e0; color:#c07a2a; border-radius:99px; padding:4px 12px; margin-bottom:10px; }
  .stem { font-size:19px; line-height:1.7; margin-bottom:16px; }
  .stem-img { width:100%; border-radius:12px; margin:0 0 14px; display:block; }
  .opt {
    display:flex; align-items:center; width:100%; text-align:left;
    background:#fffdf7; border:2px solid #f0e2c8; border-radius:14px;
    padding:14px; font-size:17px; margin:10px 0; cursor:pointer; color:#4a3b2a;
    transition:all .15s; line-height:1.5;
  }
  .opt .tag {
    flex:none; width:34px; height:34px; border-radius:50%; background:#f7ecd8;
    color:#b3541e; font-weight:800; display:flex; align-items:center; justify-content:center;
    margin-right:12px; font-size:16px;
  }
  .opt img { width:100%; border-radius:10px; display:block; }
  .opt.img-opt { flex-direction:column; align-items:stretch; }
  .opt.img-opt .tag { margin:0 0 8px 0; }
  .opt:not(.locked):active { transform:scale(.98); }
  .opt.locked { cursor:default; }
  .opt.correct { border-color:#4caf50; background:#f1f9f1; }
  .opt.correct .tag { background:#4caf50; color:#fff; }
  .opt.wrong { border-color:#f44336; background:#fef2f2; }
  .opt.wrong .tag { background:#f44336; color:#fff; }
  .opt.dim { opacity:.55; }

  .feedback { border-radius:14px; padding:16px; margin-top:14px; font-size:16px; line-height:1.7; }
  .feedback.good { background:#f1f9f1; border:2px solid #a5d6a7; }
  .feedback.bad { background:#fef6e8; border:2px solid #f0c987; }
  .feedback .ft { font-size:18px; font-weight:800; margin-bottom:6px; }
  .feedback.good .ft { color:#2e7d32; }
  .feedback.bad .ft { color:#c07a2a; }
  .feedback .last-wrong { font-size:14px; color:#a3763f; margin-bottom:8px; }
  .next-btn {
    display:block; width:100%; border:none; border-radius:16px; padding:16px;
    font-size:19px; font-weight:700; margin-top:14px; cursor:pointer;
    background:linear-gradient(135deg,#ffb347,#ff8c42); color:#fff;
    box-shadow:0 6px 16px rgba(255,140,66,.35);
  }

  /* 结果页 */
  .result { text-align:center; padding-top:30px; }
  .result .stars { font-size:52px; margin-bottom:8px; }
  .result h2 { font-size:26px; color:#b3541e; margin-bottom:6px; }
  .result .score { font-size:18px; color:#8a6d4b; margin-bottom:20px; }
  .result .score b { font-size:34px; color:#e07b2a; }

  /* 复习页 */
  .rev-item { background:#fff; border-radius:16px; padding:18px; margin:12px 0; box-shadow:0 4px 14px rgba(180,120,40,.12); }
  .rev-item .stem { font-size:16px; margin-bottom:8px; }
  .rev-item .ans { font-size:15px; color:#2e7d32; font-weight:700; margin-bottom:8px; }
  .rev-item .exp { font-size:15px; line-height:1.7; color:#6b5638; background:#fffdf4; border-left:4px solid #f0c987; padding:10px 12px; border-radius:0 10px 10px 0; }
  .rev-item img { width:100%; border-radius:10px; margin:8px 0; }
  .date-tag { font-size:12px; color:#a3763f; background:#fef3e0; border-radius:99px; padding:2px 10px; display:inline-block; margin-bottom:8px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 首页 -->
  <div id="home">
    <div class="hero">
      <div class="emoji">🏆</div>
      <h1>湘桥区2026年<br>诗词大赛错题本</h1>
      <p>古诗词专项练习 · 每天进步一点点，加油！</p>
    </div>
    <div class="stat-card">
      <div><div class="num" id="stTotal">0</div><div class="lbl">错题总数</div></div>
      <div><div class="num" id="stBest">-</div><div class="lbl">历史最佳</div></div>
      <div><div class="num" id="stDays">0</div><div class="lbl">坚持天数</div></div>
    </div>
    <button class="big-btn btn-go" onclick="startQuiz(false)">▶ 开始练习</button>
    <button class="big-btn btn-go" onclick="startQuiz(true)" style="background:linear-gradient(135deg,#7ec8e3,#4aa8de)">🔀 随机抽题练习</button>
    <button class="big-btn btn-review" onclick="showReview()">📖 复习讲解</button>
  </div>

  <!-- 答题页 -->
  <div id="quiz" class="hide">
    <div class="topbar">
      <button class="back" onclick="goHome()">‹ 返回</button>
      <div class="progress" id="qProg">第 1 / … 题</div>
    </div>
    <div class="pbar"><i id="pFill" style="width:0%"></i></div>
    <div class="qcard">
      <span class="qtype" id="qType">选择题</span>
      <div class="stem" id="qStem"></div>
      <img class="stem-img" id="qStemImg" style="display:none">
      <div id="qOpts"></div>
      <div id="qFeed" class="hide"></div>
      <button id="qNext" class="next-btn hide" onclick="nextQ()">下一题 →</button>
    </div>
  </div>

  <!-- 结果页 -->
  <div id="result" class="hide">
    <div class="result">
      <div class="stars" id="rStars">⭐⭐⭐</div>
      <h2 id="rTitle">太棒了！</h2>
      <div class="score">本轮得分 <b id="rScore">0</b> / <span id="rTotal">0</span></div>
      <button class="big-btn btn-go" onclick="startQuiz(false)">🔁 再练一轮</button>
      <button class="big-btn btn-review" onclick="showReview()">📖 看看讲解</button>
      <button class="big-btn btn-review" onclick="goHome()">🏠 回首页</button>
    </div>
  </div>

  <!-- 复习页 -->
  <div id="review" class="hide">
    <div class="topbar">
      <button class="back" onclick="goHome()">‹ 返回</button>
      <div class="progress">📖 错题讲解</div>
    </div>
    <div id="revList"></div>
  </div>

</div>

<script src="questions.js"></script>
<script src="questions2.js"></script>
<script src="questions3.js"></script>
<script src="questions4.js"></script>
  <script src="questions5.js"></script>
  <script src="questions6.js"></script>
  <script src="questions7.js"></script>
  <script src="questions8.js"></script>
  <script src="questions9.js"></script>
  <script src="questions10.js"></script>
<script>
const TYPE_NAME = { choice:"选择题", judge:"判断题", fill:"选词填空" };
const LETTERS = ["A","B","C","D"];
let order = [], idx = 0, score = 0, answered = false;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function optLabel(o){ return typeof o === "string" ? o : "（看图选择）"; }

function goHome(){
  ["quiz","result","review"].forEach(id=>document.getElementById(id).classList.add("hide"));
  document.getElementById("home").classList.remove("hide");
  renderStats();
}
function renderStats(){
  document.getElementById("stTotal").textContent = QUESTIONS.length;
  const days = new Set(QUESTIONS.map(q=>q.date)).size;
  document.getElementById("stDays").textContent = days;
  const best = localStorage.getItem("cuotiben_best");
  document.getElementById("stBest").textContent = best === null ? "-" : best + "%";
}

function startQuiz(random){
  order = QUESTIONS.map((_,i)=>i);
  if(random) shuffle(order);
  idx = 0; score = 0;
  document.getElementById("home").classList.add("hide");
  document.getElementById("result").classList.add("hide");
  document.getElementById("quiz").classList.remove("hide");
  renderQ();
}

function renderQ(){
  answered = false;
  const q = QUESTIONS[order[idx]];
  document.getElementById("qProg").textContent = `第 ${idx+1} / ${order.length} 题`;
  document.getElementById("pFill").style.width = (idx/order.length*100) + "%";
  document.getElementById("qType").textContent = TYPE_NAME[q.type] || "选择题";
  document.getElementById("qStem").textContent = q.stem;
  const stemImg = document.getElementById("qStemImg");
  if(q.stemImg){ stemImg.src = q.stemImg; stemImg.style.display = "block"; }
  else { stemImg.style.display = "none"; }
  const box = document.getElementById("qOpts");
  box.innerHTML = "";
  q.options.forEach((o,i)=>{
    const b = document.createElement("button");
    b.className = "opt" + (typeof o !== "string" ? " img-opt" : "");
    b.innerHTML = `<span class="tag">${LETTERS[i]}</span>` +
      (typeof o === "string" ? `<span>${o}</span>` : `<img src="${o.img}" alt="选项${LETTERS[i]}">`);
    b.onclick = ()=>choose(i);
    box.appendChild(b);
  });
  document.getElementById("qFeed").classList.add("hide");
  document.getElementById("qNext").classList.add("hide");
  document.getElementById("qNext").textContent = idx === order.length-1 ? "查看成绩 🎉" : "下一题 →";
}

function choose(i){
  if(answered) return;
  answered = true;
  const q = QUESTIONS[order[idx]];
  const btns = document.getElementById("qOpts").children;
  const ok = (i === q.answer);
  if(ok) score++;
  [...btns].forEach((b,j)=>{
    b.classList.add("locked");
    if(j === q.answer) b.classList.add("correct");
    else if(j === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const feed = document.getElementById("qFeed");
  feed.className = "feedback " + (ok ? "good" : "bad");
  feed.innerHTML =
    `<div class="ft">${ok ? "🎉 答对啦！" : "💪 再想想，正确答案是 " + LETTERS[q.answer]}</div>` +
    (q.kidAnswer !== undefined && q.kidAnswer !== q.answer
      ? `<div class="last-wrong">上次你选了 ${LETTERS[q.kidAnswer]}，这次别再错啦～</div>` : "") +
    `<div>📖 <b>讲解：</b>${q.explain}</div>`;
  feed.classList.remove("hide");
  document.getElementById("qNext").classList.remove("hide");
  document.getElementById("pFill").style.width = ((idx+1)/order.length*100) + "%";
}

function nextQ(){
  idx++;
  if(idx >= order.length) showResult();
  else renderQ();
}

function showResult(){
  const pct = Math.round(score/order.length*100);
  const best = localStorage.getItem("cuotiben_best");
  if(best === null || pct > +best) localStorage.setItem("cuotiben_best", pct);
  document.getElementById("rScore").textContent = score;
  document.getElementById("rTotal").textContent = order.length;
  const stars = document.getElementById("rStars");
  const title = document.getElementById("rTitle");
  if(pct === 100){ stars.textContent="⭐⭐⭐"; title.textContent="满分！太厉害了！🎊"; }
  else if(pct >= 80){ stars.textContent="⭐⭐⭐"; title.textContent="非常棒！"; }
  else if(pct >= 60){ stars.textContent="⭐⭐"; title.textContent="不错，继续加油！"; }
  else { stars.textContent="⭐"; title.textContent="多看看讲解再试一次吧！"; }
  document.getElementById("quiz").classList.add("hide");
  document.getElementById("result").classList.remove("hide");
}

function showReview(){
  const list = document.getElementById("revList");
  list.innerHTML = "";
  QUESTIONS.forEach(q=>{
    const d = document.createElement("div");
    d.className = "rev-item";
    const ansText = typeof q.options[q.answer] === "string"
      ? q.options[q.answer] : "选项 " + LETTERS[q.answer] + "（见下图）";
    let imgs = "";
    q.options.forEach((o,i)=>{
      if(typeof o !== "string") imgs += `<div class="date-tag">选项 ${LETTERS[i]}</div><img src="${o.img}">`;
    });
    d.innerHTML =
      `<div class="date-tag">${q.date} · ${TYPE_NAME[q.type]||""}</div>` +
      `<div class="stem">${q.stem}</div>` +
      (q.stemImg ? `<img class="stem-img" src="${q.stemImg}">` : "") +
      `<div class="ans">✅ 正确答案：${ansText}</div>` + imgs +
      `<div class="exp">📖 ${q.explain}</div>`;
    list.appendChild(d);
  });
  ["home","quiz","result"].forEach(id=>document.getElementById(id).classList.add("hide"));
  document.getElementById("review").classList.remove("hide");
}

renderStats();
</script>
</body>
</html>
